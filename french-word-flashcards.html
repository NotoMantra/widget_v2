<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>French Flashcards</title>
<style>
:root{
  --bg:#f7f0e3;
  --card:#fbf6ec;
  --line:#dcc6a3;
  --line-soft:#e9dbc2;
  --ink:#8c6c45;
  --ink-soft:#ae936f;
  --ink-faint:#c7b291;
  --good:#9aa57a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Apple SD Gothic Neo","Malgun Gothic","Hiragino Sans","Yu Gothic","Noto Sans CJK JP","Noto Sans KR",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.wrap{container-type:inline-size;height:100%;min-height:210px;padding:4px}
.w{height:100%;display:flex;flex-direction:column;gap:10px;background:var(--bg);border:3px solid var(--line);border-radius:20px;padding:14px 14px 12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:6px;flex-shrink:0}
button{font:inherit;color:var(--ink);background:transparent;border:2px solid var(--line);border-radius:999px;cursor:pointer;transition:background .15s,border-color .15s,transform .1s;-webkit-tap-highlight-color:transparent}
button:hover{background:var(--card);border-color:var(--ink-faint)}
button:active{transform:scale(.96)}
button:focus-visible{outline:2px solid var(--ink-soft);outline-offset:2px}
.chip{font-size:11px;font-weight:600;padding:4px 10px;letter-spacing:.04em}
.icon{width:28px;height:28px;display:grid;place-items:center;padding:0}
.icon svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card{flex:1;min-height:110px;position:relative;container-type:size;background:var(--card);border:2px solid var(--line-soft);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:14px 12px;cursor:pointer;user-select:none;overflow:hidden}
.front{font-family:"Iowan Old Style","Palatino Linotype",Georgia,"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","Noto Serif KR","Apple SD Gothic Neo","Malgun Gothic",serif;font-size:clamp(20px,min(9cqi,17cqh),44px);line-height:1.15;font-weight:500;color:var(--ink);word-break:keep-all;overflow-wrap:anywhere}
.front.big{font-size:clamp(36px,min(22cqi,30cqh),88px);line-height:1}
.front.en{font-family:inherit;font-size:clamp(16px,min(6.5cqi,13cqh),30px);font-weight:600}
.back{gap:2px;margin-top:min(10px,3cqh);display:flex;flex-direction:column;align-items:center;gap:4px;opacity:0;transform:translateY(4px);transition:opacity .25s,transform .25s}
.card.open .back{opacity:1;transform:none}
.meaning{font-size:clamp(13px,min(4.6cqi,9cqh),19px);font-weight:600;color:var(--ink)}
.meaning.native{font-family:"Iowan Old Style",Georgia,"Hiragino Mincho ProN","Yu Mincho","Apple SD Gothic Neo","Malgun Gothic",serif;font-size:clamp(18px,min(8cqi,15cqh),36px);font-weight:500}
.sub{font-size:12px;color:var(--ink-soft);line-height:1.5}
.sub b{font-weight:600;color:var(--ink-soft);letter-spacing:.04em;margin-right:3px}
.hint{position:absolute;bottom:8px;left:0;right:0;font-size:11px;color:var(--ink-faint);transition:opacity .2s}
.card.open .hint{opacity:0}
.pill{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;border:1.5px solid var(--line);border-radius:999px;padding:1px 7px;color:var(--ink-soft)}
.actions{display:flex;gap:8px}
.actions button{flex:1;padding:9px 6px;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.actions .know{background:var(--card)}
.actions svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.prog{display:flex;align-items:center;gap:8px}
.bar{flex:1;height:6px;border-radius:99px;background:var(--line-soft);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ink-faint);border-radius:99px;transition:width .3s}
.count{font-size:11px;color:var(--ink-soft);white-space:nowrap;font-variant-numeric:tabular-nums}
.menu{position:absolute;inset:0;background:var(--bg);border-radius:12px;padding:14px;display:none;flex-direction:column;gap:10px;justify-content:center;cursor:default;text-align:left;z-index:2}
.menu.show{display:flex}
.menu h4{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.menu p{font-size:12px;color:var(--ink-soft);line-height:1.5}
.menu .row{display:flex;gap:8px;flex-wrap:wrap}
.menu .row button{font-size:12px;font-weight:600;padding:6px 12px}
.menu .credit{font-size:10px;color:var(--ink-faint)}
.done{font-size:15px;font-weight:600}
/* compact: narrow columns */
@container (max-width:300px){
  .w{padding:10px;gap:8px;border-radius:16px}
  .tag{font-size:10px}
  .wc{display:none}
  .chip{padding:3px 8px;font-size:10px}
  .actions button span{display:none}
  .actions button{padding:8px 4px}
  .hint{display:none}
  .sub{font-size:11px}
}
@container (max-width:200px){
  .count{display:none}
  .tools .icon{display:none}
}
</style>
</head>
<body>
<div class="wrap">
<div class="w" id="app">
  <div class="top">
    <div class="tag" id="tag">French<span class="wc"> · 1,010 words</span></div>
    <div class="tools">
      <button class="chip" id="dir" title="Switch direction" aria-label="Switch direction"></button>
      <button class="icon" id="more" title="Options" aria-label="Options"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
    </div>
  </div>
  <div class="card" id="card" role="button" tabindex="0" aria-label="Flashcard, tap to reveal">
    <div class="front" id="front"></div>
    <div class="back" id="back"></div>
    <div class="hint" id="hint">tap to reveal</div>
    <div class="menu" id="menu">
      <h4>Options</h4>
      <p id="menuinfo"></p>
      <div class="row">
        <button id="reset">Reset progress</button>
        <button id="close">Close</button>
      </div>
      <p class="credit">Saved only in this browser. Nothing is sent anywhere.</p>
    </div>
  </div>
  <div class="actions">
    <button id="again" aria-label="Show again later"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg><span>Again</span></button>
    <button id="know" class="know" aria-label="I know this"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg><span>Know it</span></button>
  </div>
  <div class="prog"><div class="bar"><i id="barfill"></i></div><div class="count" id="count"></div></div>
</div>
</div>

<script>
(function(){
"use strict";
var CFG={"id": "fr", "from": "FR", "to": "EN", "kind": "word"};
var W=[];(document.getElementById("data").textContent||"").split("\n").forEach(function(l){l=l.trim();if(!l)return;var p=l.split("|");if(p.length>=2&&p[0]&&p[1])W.push(p)});
if(!W.length)return;
var KEY="notomantra-flash-"+CFG.id;
var mem={};
function load(){try{var s=localStorage.getItem(KEY);return s?JSON.parse(s):null}catch(e){return mem[KEY]||null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){mem[KEY]=st}}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function freshDeck(){var k={};st.known.forEach(function(i){k[i]=1});var d=[];for(var i=0;i<W.length;i++)if(!k[i])d.push(i);return shuffle(d)}
var st=load();
if(!st||!Array.isArray(st.known)||!Array.isArray(st.deck)||st.n!==W.length){st={n:W.length,known:[],deck:[],dir:0,open:false}}
if(!st.deck.length)st.deck=freshDeck();
var $=function(id){return document.getElementById(id)};
var card=$("card"),front=$("front"),back=$("back"),menu=$("menu");
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function render(){
  $("dir").textContent=st.dir?CFG.to+" → "+CFG.from:CFG.from+" → "+CFG.to;
  var known=st.known.length,total=W.length;
  $("barfill").style.width=(known/total*100).toFixed(1)+"%";
  $("count").textContent=known.toLocaleString("en-US")+" / "+total.toLocaleString("en-US")+" known";
  card.classList.toggle("open",!!st.open);
  if(!st.deck.length){
    front.className="front en";front.innerHTML='<span class="done">All '+total.toLocaleString("en-US")+' marked as known.</span>';
    back.innerHTML='<div class="sub">Tap … then Reset progress to go again.</div>';card.classList.add("open");return;
  }
  var w=W[st.deck[0]];
  var f=CFG.kind;
  if(!st.dir){
    front.className="front"+(f==="kanji"?" big":"");
    front.textContent=w[0];
    back.innerHTML='<div class="meaning">'+esc(w[1])+'</div>'+extra(w);
  }else{
    front.className="front en";
    front.textContent=w[1];
    back.innerHTML='<div class="meaning native">'+esc(w[0])+'</div>'+extra(w);
  }
}
function extra(w){
  if(CFG.kind==="kanji"){
    var h="";
    if(w[2])h+='<div class="sub"><b>ON</b>'+esc(w[2])+'</div>';
    if(w[3])h+='<div class="sub"><b>KUN</b>'+esc(w[3])+'</div>';
    if(w[4])h+='<div><span class="pill">JLPT '+esc(w[4])+'</span></div>';
    return h;
  }
  if(CFG.kind==="ko"&&w[2])return '<div class="sub">'+esc(w[2])+'</div>';
  return "";
}
function flip(){if(menu.classList.contains("show"))return;if(!st.deck.length)return;st.open=!st.open;save();render()}
function next(known){
  if(!st.deck.length)return;
  var i=st.deck.shift();
  if(known){if(st.known.indexOf(i)<0)st.known.push(i)}
  else{var pos=Math.min(st.deck.length,8+Math.floor(Math.random()*12));st.deck.splice(pos,0,i)}
  st.open=false;save();render();
}
card.addEventListener("click",function(e){if(menu.contains(e.target))return;flip()});
card.addEventListener("keydown",function(e){if(e.target!==card)return;if(e.key===" "||e.key==="Enter"){e.preventDefault();flip()}});
document.addEventListener("keydown",function(e){if(menu.classList.contains("show"))return;if(e.key==="ArrowRight")next(false);if(e.key==="ArrowUp")next(true)});
$("again").addEventListener("click",function(){next(false)});
$("know").addEventListener("click",function(){next(true)});
$("dir").addEventListener("click",function(){st.dir=st.dir?0:1;st.open=false;save();render()});
$("more").addEventListener("click",function(e){e.stopPropagation();
  $("menuinfo").textContent=st.known.length+" known, "+st.deck.length+" still in rotation. Known words are skipped until you reset.";
  menu.classList.toggle("show")});
$("close").addEventListener("click",function(e){e.stopPropagation();menu.classList.remove("show")});
$("reset").addEventListener("click",function(e){e.stopPropagation();st={n:W.length,known:[],deck:[],dir:st.dir,open:false};st.deck=freshDeck();save();menu.classList.remove("show");render()});
render();
})();
</script>
