<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--g:#3f7d5a;--g2:#6f9e80;--leaf:#9cc2a6;--leaf2:#cfe2d3;--ink:#22302a;--mute:rgba(34,48,42,.62);--bg:#f1f6f1;--bg2:#e7f0e8;--line:rgba(63,125,90,.28)}
@media (prefers-color-scheme:dark){:root{--g:#8fc7a2;--g2:#6fa585;--leaf:#4e7a5e;--leaf2:#2c4235;--ink:#e6efe8;--mute:rgba(230,239,232,.6);--bg:#1b2420;--bg2:#212c27;--line:rgba(143,199,162,.25)}}
*{box-sizing:border-box}
html,body{margin:0;background:transparent}
body{padding:6px;color:var(--ink);-webkit-font-smoothing:antialiased}
a.card{position:relative;display:flex;align-items:stretch;width:100%;min-height:150px;border:1.5px solid var(--line);border-radius:22px;background:linear-gradient(100deg,var(--bg) 0%,var(--bg2) 100%);color:inherit;text-decoration:none;overflow:hidden;cursor:pointer;transition:box-shadow .3s,transform .3s}
a.card:hover{box-shadow:0 6px 24px rgba(63,125,90,.14);transform:translateY(-1px)}
a.card:focus-visible{outline:2px solid var(--g);outline-offset:3px}
.sprig{position:absolute;pointer-events:none;transition:transform 1.2s ease}
.sprig.l{left:-30px;bottom:-46px;width:118px;transform-origin:20% 90%;opacity:.9}
.sprig.r{right:-14px;top:-24px;width:170px;transform:scaleX(-1) rotate(160deg);transform-origin:50% 50%}
a.card:hover .sprig.l{transform:rotate(-4deg)}
a.card:hover .sprig.r{transform:scaleX(-1) rotate(156deg)}
.half{position:relative;z-index:1;flex:1 1 0;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:22px clamp(22px,4vw,48px)}
.half.l{padding-left:clamp(64px,9vw,120px)}
.half.r{padding-right:clamp(40px,8vw,120px)}
.mid{position:relative;z-index:1;flex:none;width:1px;margin:24px 0;background:var(--line)}
.mid::after{content:"";position:absolute;left:50%;top:50%;width:9px;height:9px;border-radius:50% 0;background:var(--g2);transform:translate(-50%,-50%) rotate(45deg)}
.kick{font:600 11px/1 Inter,system-ui,sans-serif;letter-spacing:.32em;text-transform:uppercase;color:var(--g)}
.hello{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:600;font-size:clamp(24px,3.4vw,38px);line-height:1.08;color:var(--g)}
.meta{font:500 12.5px/1.4 Inter,system-ui,sans-serif;color:var(--mute);font-variant-numeric:tabular-nums}
.tip{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:clamp(16px,1.7vw,19px);line-height:1.3;color:var(--ink);margin-top:2px}
.pitch{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:clamp(18px,2.1vw,24px);line-height:1.22;color:var(--ink);max-width:40ch}
.pitch b{font-weight:600;font-style:italic;color:var(--g)}
.hint{font:500 12.5px/1.4 Inter,system-ui,sans-serif;color:var(--mute);display:inline-flex;gap:6px;align-items:center}
.hint i{font-style:normal;display:inline-block;transition:transform .3s}
a.card:hover .hint{color:var(--g)}
a.card:hover .hint i{transform:translateX(4px)}
@media (max-width:620px){a.card{flex-direction:column}.mid{width:auto;height:1px;margin:0 28px}.half,.half.l,.half.r{padding:18px 26px}.half.l{padding-right:84px}.sprig.l{display:none}.sprig.r{width:110px}}
</style></head>
<body>
<a class="card" href="https://notomantra.gumroad.com/l/2027-life-pro" target="_blank" rel="noopener" aria-label="Welcome to your 2027 Life Planner. Open 2027 Life Planner Pro">
<svg class="sprig l" viewBox="0 0 160 160" aria-hidden="true"><path d="M8 152 C40 120 70 92 150 18" fill="none" stroke="var(--g2)" stroke-width="2.4" stroke-linecap="round"/><g fill="var(--leaf)"><ellipse cx="44" cy="112" rx="15" ry="6" transform="rotate(-62 44 112)"/><ellipse cx="62" cy="122" rx="15" ry="6" transform="rotate(10 62 122)"/><ellipse cx="78" cy="78" rx="15" ry="6" transform="rotate(-62 78 78)"/><ellipse cx="96" cy="90" rx="15" ry="6" transform="rotate(8 96 90)"/><ellipse cx="112" cy="48" rx="14" ry="5.5" transform="rotate(-60 112 48)"/><ellipse cx="128" cy="58" rx="14" ry="5.5" transform="rotate(6 128 58)"/></g><g fill="var(--leaf2)"><ellipse cx="26" cy="132" rx="12" ry="5" transform="rotate(14 26 132)"/><ellipse cx="140" cy="26" rx="11" ry="4.5" transform="rotate(-50 140 26)"/></g></svg>
<svg class="sprig r" viewBox="0 0 160 160" aria-hidden="true"><path d="M8 152 C40 120 70 92 150 18" fill="none" stroke="var(--g2)" stroke-width="2.4" stroke-linecap="round"/><g fill="var(--leaf)"><ellipse cx="44" cy="112" rx="15" ry="6" transform="rotate(-62 44 112)"/><ellipse cx="62" cy="122" rx="15" ry="6" transform="rotate(10 62 122)"/><ellipse cx="78" cy="78" rx="15" ry="6" transform="rotate(-62 78 78)"/><ellipse cx="96" cy="90" rx="15" ry="6" transform="rotate(8 96 90)"/><ellipse cx="112" cy="48" rx="14" ry="5.5" transform="rotate(-60 112 48)"/></g><circle cx="100" cy="66" r="5" fill="var(--g)"/></svg>
<div class="half l">
<div class="kick" id="k1">Welcome</div>
<div class="hello" id="hi">Welcome to your 2027.</div>
<div class="meta" id="dt"></div>
<div class="tip" id="tip"></div>
</div>
<div class="mid"></div>
<div class="half r">
<div class="kick">When you're ready</div>
<div class="pitch">Your whole year in one calm place. Meals, money, reading, workouts and travel live in <b>2027 Life Planner Pro</b>.</div>
<div class="hint">Tap anywhere to take a look <i>&rsaquo;</i></div>
</div>
</a>
<script>
var SL=[[0,5,'Still up','Welcome to your calm 2027.',['Write tomorrow’s first task down, then let today be done.','Nothing good gets decided after midnight. Park it till morning.']],
[5,12,'Good morning, you','Welcome to your calm 2027.',['Pick one thing that would make today feel good. Just one.','Water first, phone later. Small start, calm day.','Write your top 3 before the day writes them for you.']],
[12,17,'Good afternoon, you','Welcome to your calm 2027.',['Halfway there. Drop one thing that no longer matters today.','Feeling the slump? A five minute walk beats a third coffee.','Tick off one small task. Momentum starts small.']],
[17,21,'Good evening, you','Welcome to your calm 2027.',['Write down one thing that went well today. It counts.','Lay out tomorrow’s first step so morning-you can start easy.','Slow evenings make better mornings.']],
[21,24,'Winding down','Welcome to your calm 2027.',['Phone on the charger, a little away from the bed.','Mind still busy? Empty it into your notes and sleep lighter.','Tomorrow is a fresh page.']]];
function pad(n){return String(n).padStart(2,'0')}
function paint(){var d=new Date(),h=d.getHours(),s=SL.filter(function(x){return h>=x[0]&&h<x[1]})[0];
var y=d.getFullYear(),day=Math.floor((new Date(y,d.getMonth(),d.getDate())-new Date(y,0,1))/864e5)+1,len=(new Date(y+1,0,1)-new Date(y,0,1))/864e5;
var hh=h%12||12,ap=h>=12?'pm':'am',t=hh+':'+pad(d.getMinutes())+' '+ap;
var extra;if(y<2027){var left=Math.round((new Date(2027,0,1)-new Date(y,d.getMonth(),d.getDate()))/864e5);extra=left+(left==1?' day':' days')+' until 2027';}
else{extra='Day '+day+' of '+len;}
document.getElementById('k1').textContent=s[2];
document.getElementById('hi').textContent=s[3];
document.getElementById('dt').textContent=d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})+' · '+t+' · '+extra;
var doy=day;document.getElementById('tip').textContent=s[4][(doy+h)%s[4].length];}
paint();setInterval(paint,30000);
</script>
</body></html>
