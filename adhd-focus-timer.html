<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visual Focus Timer</title>
<style>
/* NotoMantra · ADHD Life OS · Visual focus timer
   Single file, no external requests.
   The timer works fully without storage. Storage only remembers
   your last length, today's count, sound on/off, and a running
   timer across reloads. If storage is blocked, nothing breaks. */
:root{
  --p:#9065B0;          /* Notion purple */
  --p-deep:#6E4C8C;
  --p-soft:#B79AD0;
  --tint:rgba(144,101,176,.07);
  --line:rgba(144,101,176,.55);
  --faint:rgba(144,101,176,.22);
}
@media (prefers-color-scheme:dark){
  :root{
    --p:#B08AD6; --p-deep:#D2B8EC; --p-soft:#8763AC;
    --tint:rgba(157,104,211,.10);
    --line:rgba(176,138,214,.55);
    --faint:rgba(176,138,214,.22);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent}
body{
  font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  color:var(--p);display:flex;justify-content:center;padding:6px;
  -webkit-font-smoothing:antialiased;
}
.callout{
  width:100%;max-width:330px;border:1.5px solid var(--line);border-radius:10px;
  background:var(--tint);padding:14px 16px 14px;
}
.head{display:flex;align-items:center;gap:8px}
.head svg{flex:none}
.title{font-size:14px;font-weight:600;color:var(--p-deep);flex:1}
.icon-btn{
  background:none;border:1px solid transparent;border-radius:6px;color:var(--p);
  width:28px;height:28px;display:grid;place-items:center;cursor:pointer;
}
.icon-btn:hover{border-color:var(--faint)}
.hint{font-size:12px;margin-top:2px;min-height:16px;opacity:.9}

/* ---- the disc ---- */
.face{position:relative;width:210px;height:210px;margin:12px auto 6px}
.face svg.dial{position:absolute;inset:0;width:100%;height:100%}
.track,.wedge{position:absolute;inset:36px;border-radius:50%}
.track{border:1px dashed var(--faint)}
.wedge{
  --deg:150deg;
  background:
    radial-gradient(circle at 38% 32%,rgba(255,255,255,.30),transparent 45%),
    radial-gradient(circle,var(--p-deep) 0%,var(--p) 62%,var(--p-soft) 100%);
  -webkit-mask:conic-gradient(#000 0 var(--deg),transparent 0);
          mask:conic-gradient(#000 0 var(--deg),transparent 0);
  filter:drop-shadow(0 0 10px rgba(144,101,176,.35));
}
.face.idle .wedge{animation:breathe 4.5s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.025);opacity:.86}}
.hand{
  position:absolute;left:calc(50% - 1px);top:calc(50% - 69px);width:2px;height:69px;
  background:var(--p-deep);transform-origin:50% 100%;border-radius:2px;
}
.hand::after{
  content:"";position:absolute;left:-4px;top:-5px;width:10px;height:10px;border-radius:50%;
  background:var(--p-deep);box-shadow:0 0 0 3px var(--tint),0 0 12px var(--p);
}
.knob{
  position:absolute;left:calc(50% - 10px);top:calc(50% - 10px);width:20px;height:20px;
  border-radius:50%;border:1.5px solid var(--p-deep);background:var(--p-soft);
}
.ripple{position:absolute;inset:36px;border-radius:50%;border:1.5px solid var(--p);opacity:0;pointer-events:none}
.face.done .ripple{animation:ripple 1.8s ease-out 2}
.face.done .ripple.r2{animation-delay:.6s}
@keyframes ripple{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.45);opacity:0}}

.time{
  text-align:center;font-size:30px;font-weight:600;color:var(--p-deep);
  font-variant-numeric:tabular-nums;letter-spacing:.5px;line-height:1.1;
}

/* ---- controls ---- */
.lengths{display:flex;gap:6px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.chip{
  font:inherit;font-size:12px;color:var(--p);background:transparent;
  border:1px solid var(--faint);border-radius:999px;padding:4px 10px;cursor:pointer;
}
.chip:hover{border-color:var(--line)}
.chip.on{background:var(--p);color:#fff;border-color:var(--p)}
@media (prefers-color-scheme:dark){.chip.on{color:#1f1a24}}
.stepper{display:flex;align-items:center;border:1px solid var(--faint);border-radius:999px;overflow:hidden}
.stepper button{font:inherit;font-size:14px;width:24px;height:24px;border:0;background:none;color:var(--p);cursor:pointer}
.stepper input{
  width:28px;border:0;background:none;color:var(--p-deep);font:inherit;font-size:12px;
  text-align:center;-moz-appearance:textfield;
}
.stepper input::-webkit-inner-spin-button,.stepper input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.stepper span{font-size:11px;padding-right:8px}
.lengths.locked{opacity:.4;pointer-events:none}

.actions{display:flex;gap:8px;margin-top:12px}
.btn{
  flex:1;font:inherit;font-size:13px;font-weight:600;padding:8px 0;border-radius:8px;cursor:pointer;
  border:1.5px solid var(--p);
}
.btn.main{background:var(--p);color:#fff}
@media (prefers-color-scheme:dark){.btn.main{color:#1f1a24}}
.btn.ghost{background:transparent;color:var(--p);flex:.55}
.btn:hover{filter:brightness(1.06)}
.foot{display:flex;justify-content:space-between;font-size:11px;margin-top:10px;opacity:.85}

button:focus-visible,input:focus-visible{outline:2px solid var(--p);outline-offset:2px}
@media (prefers-reduced-motion:reduce){
  .face.idle .wedge,.face.done .ripple{animation:none}
}
</style>
</head>
<body>
<div class="callout" role="region" aria-label="Visual focus timer">
  <div class="head">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="13" r="8"/><path d="M12 13V9M9 2h6M12 5V2"/>
    </svg>
    <div class="title">Visual focus timer</div>
    <button class="icon-btn" id="mute" aria-label="Sound on"></button>
  </div>
  <div class="hint" id="hint">Pick a length, then start</div>

  <div class="face idle" id="face">
    <svg class="dial" id="dial" viewBox="0 0 200 200" aria-hidden="true"></svg>
    <div class="track"></div>
    <div class="ripple"></div><div class="ripple r2"></div>
    <div class="wedge" id="wedge"></div>
    <div class="hand" id="hand"></div>
    <div class="knob"></div>
  </div>
  <div class="time" id="time" aria-live="off">25:00</div>

  <div class="lengths" id="lengths">
    <button class="chip" data-m="5">5</button>
    <button class="chip" data-m="15">15</button>
    <button class="chip" data-m="25">25</button>
    <button class="chip" data-m="45">45</button>
    <div class="stepper">
      <button id="minus" aria-label="One minute less">−</button>
      <input id="custom" type="number" min="1" max="60" value="25" aria-label="Minutes">
      <button id="plus" aria-label="One minute more">+</button>
      <span>min</span>
    </div>
  </div>

  <div class="actions">
    <button class="btn main" id="go">Start</button>
    <button class="btn ghost" id="reset">Reset</button>
  </div>
  <div class="foot"><span id="count">Focus blocks today: 0</span><span>NotoMantra</span></div>
</div>

<script>
(function(){
  /* ---------- storage: optional, never trusted ---------- */
  var KEY = "nm_adhd_focus_timer_v1", mem = null;
  function load(){
    try { var raw = window.localStorage.getItem(KEY); if (raw) return JSON.parse(raw); } catch(e){}
    return mem;
  }
  function save(){
    mem = JSON.parse(JSON.stringify(s));
    try { window.localStorage.setItem(KEY, JSON.stringify(s)); } catch(e){}
  }
  function today(){ var d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }

  var defaults = {dur:25, endAt:null, left:null, day:today(), count:0, muted:false};
  var s = defaults, got = load();
  if (got && typeof got === "object") {
    s = {
      dur: clamp(+got.dur || 25),
      endAt: typeof got.endAt === "number" ? got.endAt : null,
      left: typeof got.left === "number" ? got.left : null,
      day: got.day || today(),
      count: +got.count || 0,
      muted: !!got.muted
    };
  }
  if (s.day !== today()) { s.day = today(); s.count = 0; }

  /* ---------- elements ---------- */
  var $ = function(id){ return document.getElementById(id); };
  var face=$("face"), wedge=$("wedge"), hand=$("hand"), timeEl=$("time"), hint=$("hint"),
      go=$("go"), resetBtn=$("reset"), lengths=$("lengths"), custom=$("custom"),
      countEl=$("count"), muteBtn=$("mute");
  var chips = lengths.querySelectorAll(".chip");
  var done = false, raf = 0, lastText = "";

  /* ---------- dial ticks ---------- */
  (function(){
    var svg = $("dial"), ns = "http://www.w3.org/2000/svg", out = "";
    for (var i=0;i<60;i++){
      var a = i*6*Math.PI/180, major = i%5===0;
      var r1 = 96, r2 = major ? 87 : 91;
      out += '<line x1="'+(100+r1*Math.sin(a)).toFixed(2)+'" y1="'+(100-r1*Math.cos(a)).toFixed(2)+
             '" x2="'+(100+r2*Math.sin(a)).toFixed(2)+'" y2="'+(100-r2*Math.cos(a)).toFixed(2)+
             '" stroke="currentColor" stroke-width="'+(major?1.4:.7)+'" opacity="'+(major?.75:.4)+'"/>';
    }
    [["0",0],["15",90],["30",180],["45",270]].forEach(function(l){
      var a = l[1]*Math.PI/180, r = 78;
      out += '<text x="'+(100+r*Math.sin(a)).toFixed(2)+'" y="'+(100-r*Math.cos(a)+3).toFixed(2)+
             '" text-anchor="middle" font-size="8" fill="currentColor" opacity=".7">'+l[0]+'</text>';
    });
    svg.innerHTML = out;
  })();

  /* ---------- sound (tiny synth chime, no files) ---------- */
  var ctx = null;
  function unlockAudio(){
    try { if (!ctx) ctx = new (window.AudioContext||window.webkitAudioContext)(); if (ctx.state==="suspended") ctx.resume(); } catch(e){}
  }
  function chime(){
    if (s.muted || !ctx) return;
    try {
      [659.25, 880, 1046.5].forEach(function(f,i){
        var o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime + i*0.22;
        o.type = "sine"; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.18,t+0.03);
        g.gain.exponentialRampToValueAtTime(0.0001,t+1.2);
        o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t+1.25);
      });
    } catch(e){}
    try { if (navigator.vibrate) navigator.vibrate([120,80,120]); } catch(e){}
  }
  function drawMute(){
    muteBtn.innerHTML = s.muted
      ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m22 9-6 6M16 9l6 6"/></svg>'
      : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
    muteBtn.setAttribute("aria-label", s.muted ? "Sound off" : "Sound on");
  }

  /* ---------- timer logic (absolute end time, survives reloads) ---------- */
  function clamp(n){ n = Math.round(n); return Math.min(60, Math.max(1, isNaN(n)?25:n)); }
  function state(){ return s.endAt ? "running" : (s.left!=null ? "paused" : "idle"); }
  function remaining(){
    if (s.endAt) return Math.max(0, s.endAt - Date.now());
    if (s.left != null) return s.left;
    return done ? 0 : s.dur*60000;
  }
  function fmt(ms){
    var t = Math.ceil(ms/1000), m = Math.floor(t/60), sec = t%60;
    return (m<10?"0":"")+m+":"+(sec<10?"0":"")+sec;
  }

  function render(){
    var ms = remaining(), st = state();
    var deg = Math.min(360, ms/3600000*360);
    wedge.style.setProperty("--deg", deg.toFixed(2)+"deg");
    hand.style.transform = "rotate("+deg.toFixed(2)+"deg)";
    var txt = fmt(ms);
    if (txt !== lastText){ timeEl.textContent = txt; lastText = txt; }

    face.classList.toggle("idle", st==="idle" && !done);
    face.classList.toggle("done", done);
    go.textContent = st==="running" ? "Pause" : st==="paused" ? "Resume" : done ? "Go again" : "Start";
    hint.textContent = st==="running" ? "One task. Let the purple melt away."
                     : st==="paused" ? "Paused. Pick it back up when ready."
                     : done ? "Done. Stand up, stretch, sip water."
                     : "Pick a length, then start";
    lengths.classList.toggle("locked", st!=="idle");
    for (var i=0;i<chips.length;i++) chips[i].classList.toggle("on", +chips[i].dataset.m === s.dur);
    if (document.activeElement !== custom) custom.value = s.dur;
    countEl.textContent = "Focus blocks today: " + s.count;
  }

  function frame(){
    raf = 0;
    if (s.endAt && Date.now() >= s.endAt) { finish(true); return; }
    render();
    if (s.endAt && !document.hidden) raf = requestAnimationFrame(frame);
  }
  function kick(){ if (!raf) raf = requestAnimationFrame(frame); }

  function start(){
    unlockAudio();
    if (s.left != null) { s.endAt = Date.now() + s.left; s.left = null; }
    else { s.endAt = Date.now() + s.dur*60000; }
    done = false; face.classList.remove("done");
    save(); kick();
  }
  function pause(){ s.left = remaining(); s.endAt = null; save(); render(); }
  function reset(){ s.endAt = null; s.left = null; done = false; save(); render(); }
  function finish(withSound){
    s.endAt = null; s.left = null; done = true;
    if (s.day !== today()) { s.day = today(); s.count = 0; }
    s.count++;
    save(); render();
    if (withSound) chime();
  }
  function setDur(n){
    if (state() !== "idle") return;
    s.dur = clamp(n); done = false; save(); render();
  }

  /* ---------- events ---------- */
  go.addEventListener("click", function(){
    var st = state();
    if (st === "running") pause();
    else { if (done) { done = false; } start(); }
  });
  resetBtn.addEventListener("click", reset);
  for (var i=0;i<chips.length;i++) chips[i].addEventListener("click", function(){ setDur(+this.dataset.m); });
  $("minus").addEventListener("click", function(){ setDur(s.dur-1); });
  $("plus").addEventListener("click", function(){ setDur(s.dur+1); });
  custom.addEventListener("change", function(){ setDur(+custom.value); });
  custom.addEventListener("blur", render);
  muteBtn.addEventListener("click", function(){ s.muted = !s.muted; unlockAudio(); save(); drawMute(); });
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) kick(); });
  setInterval(function(){ if (s.endAt && Date.now() >= s.endAt) finish(true); }, 1000);

  /* ---------- boot ---------- */
  if (s.endAt && Date.now() >= s.endAt) finish(false);  /* ended while closed: count it quietly */
  drawMute(); render(); if (s.endAt) kick();
})();
</script>
</body>
</html>
